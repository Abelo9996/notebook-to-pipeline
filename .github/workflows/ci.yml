name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --python ${{ matrix.python }}
      - name: Lint
        run: uv run ruff check src tests && uv run ruff format --check src tests
      - name: Test
        run: uv run pytest -q
      - name: Build
        run: uv build

  scaffold-e2e:
    # Fresh uv and pip projects from the example notebooks: capture, scaffold, the generated test
    # (must pass, then fail after a deliberate change) and the generated workflow's steps.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build
        run: uv build
      - name: Scaffold end to end
        run: FIND_LINKS=dist examples/scaffold_e2e.sh
